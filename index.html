<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>QuickNotes</h1>
      <p class="lead">Load, create and delete notes through an API.</p>
    </header>

    <section class="toolbar" aria-label="Load notes">
      <button id="load-btn" type="button">Load notes</button>
    </section>

    <p id="status" role="status" aria-live="polite">Click "Load notes" to start.</p>

    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">New note</h2>
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title (required, max 100 characters)</label>
          <input id="title-input" name="title" type="text" autocomplete="off" aria-required="true">
        </div>
        <div class="field">
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="4"></textarea>
        </div>
        <button id="submit-btn" type="submit">Save note</button>
      </form>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
